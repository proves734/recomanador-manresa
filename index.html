<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomanador electoral Manresa 2027 (pilot)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1; --sup:#FFFFFF; --ink:#1C2B33; --muted:#56666C; --line:#D2D9D4;
  --riu:#1F6E6A; --riu-fosc:#16524F; --pedra:#B8862F;
  --titol:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.0625rem;line-height:1.55}
.capcalera{max-width:760px;margin:0 auto;padding:1.25rem 1.25rem 0;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.marca{font-family:var(--titol);font-weight:700;font-size:1.05rem}
.etiqueta-pilot{font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.15rem .65rem}
main{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1,h2,h3{font-family:var(--titol);line-height:1.12;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;max-width:14ch;margin-bottom:1.25rem}
h2{font-size:clamp(1.5rem,3.6vw,2.15rem);font-weight:700;margin-bottom:1.75rem;max-width:30ch}
h2:focus{outline:none}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch;margin:0 0 1.5rem}
.avis{background:var(--sup);border-left:4px solid var(--pedra);padding:.8rem 1rem;max-width:60ch;margin:0 0 2rem;font-size:.98rem}
button{font:inherit;cursor:pointer}
.primari{background:var(--riu);color:#fff;border:0;border-radius:.5rem;padding:.85rem 1.5rem;font-weight:700}
.primari:hover{background:var(--riu-fosc)}
.primari:disabled{opacity:.45;cursor:not-allowed}
.secundari{background:transparent;border:0;color:var(--riu-fosc);padding:.5rem 0;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--pedra);outline-offset:2px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:1.5rem}

/* Progrés */
.progres{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);margin-bottom:.5rem}
.progres span:first-child{color:var(--riu-fosc);font-weight:700}
.barra-progres{height:4px;background:var(--line);border-radius:2px;margin-bottom:2.5rem;overflow:hidden}
.barra-progres div{height:100%;background:var(--riu)}

/* Format acord */
.opcions{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.opcio{background:var(--sup);border:1.5px solid var(--line);border-radius:.5rem;padding:1rem .5rem;min-height:4.5rem;color:var(--ink);line-height:1.25}
.opcio:hover{border-color:var(--riu)}
.opcio[aria-pressed="true"]{background:var(--riu);border-color:var(--riu);color:#fff}
@media (max-width:600px){
  .opcions{grid-template-columns:1fr}
  .opcio{min-height:auto;padding:.85rem 1rem;text-align:left}
}

/* Format bipolar: una línia entre dos pols */
.pols{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.25rem}
.pol{margin:0;font-weight:700;font-size:1.08rem;line-height:1.3}
.pol.dre{text-align:right}
.linia{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.linia::before{content:"";position:absolute;top:22px;left:10%;right:10%;height:3px;background:var(--line);transform:translateY(-50%)}
.parada{position:relative;z-index:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--muted)}
.cercle-caixa{height:44px;display:flex;align-items:center;justify-content:center}
.cercle{display:block;border-radius:50%;background:var(--sup);border:2.5px solid var(--line);transition:background .15s,border-color .15s}
.parada:nth-child(1) .cercle,.parada:nth-child(5) .cercle{width:42px;height:42px}
.parada:nth-child(2) .cercle,.parada:nth-child(4) .cercle{width:32px;height:32px}
.parada:nth-child(3) .cercle{width:24px;height:24px}
.parada:hover .cercle{border-color:var(--riu)}
.parada[aria-pressed="true"] .cercle{background:var(--riu);border-color:var(--riu)}
.parada[aria-pressed="true"]{color:var(--ink);font-weight:700}
.etiq{font-size:.88rem;line-height:1.2;text-align:center;max-width:7rem}

/* No ho sé, separat de l'escala */
.ns{margin-top:1.75rem;padding-top:1.25rem;border-top:1px dashed var(--line)}
.opcio-ns{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:.45rem 1.1rem;color:var(--muted)}
.opcio-ns:hover{border-color:var(--muted)}
.opcio-ns[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:#fff}

/* Importància */
.temes{border-top:1px solid var(--line)}
.tema-fila{display:flex;justify-content:space-between;align-items:center;gap:.75rem 1rem;padding:.85rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tema-nom{font-weight:700;max-width:30ch}
.segmentat{display:inline-flex;border:1.5px solid var(--line);border-radius:.5rem;overflow:hidden;background:var(--sup)}
.segmentat button{border:0;border-left:1px solid var(--line);background:transparent;padding:.45rem .8rem;color:var(--ink)}
.segmentat button:first-child{border-left:0}
.segmentat button[aria-pressed="true"]{background:var(--riu);color:#fff}
.falten{color:var(--muted);font-size:.95rem;margin:1rem 0 0;min-height:1.5em}
.consentiment{display:flex;gap:.75rem;align-items:flex-start;background:var(--sup);border:1.5px solid var(--line);border-radius:.5rem;padding:.9rem 1rem;margin-top:1.5rem;max-width:62ch;font-size:.98rem;cursor:pointer}
.consentiment input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--riu);flex:none}

/* Resultats */
.llista{list-style:none;padding:0;margin:0 0 2rem;border-top:1px solid var(--line)}
.llista li{border-bottom:1px solid var(--line)}
summary{list-style:none;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:.4rem 1rem;padding:1.1rem 0;cursor:pointer}
summary::-webkit-details-marker{display:none}
.nom{font-family:var(--titol);font-weight:700;font-size:1.3rem}
.pct{font-family:var(--titol);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--c)}
.pista{grid-column:1/-1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.omple{display:block;height:100%;width:0;background:var(--c);border-radius:5px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.mes{grid-column:1/-1;font-size:.92rem;color:var(--riu-fosc);text-decoration:underline;text-underline-offset:3px}
.mes::after{content:"Mostra el detall"}
details[open] .mes::after{content:"Amaga el detall"}
.detall{padding:0 0 1.5rem}
.llegenda{display:flex;gap:1.25rem;align-items:center;font-size:.92rem;color:var(--muted);margin:0 0 .5rem}
.llegenda span{display:inline-flex;align-items:center;gap:.45rem}
.tema-detall{margin-top:1.25rem}
.tema-detall h3{font-size:1.1rem;display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.35rem;margin-bottom:.25rem}
.tema-detall h3 span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
.dim{padding:.7rem 0}
.dim p{margin:0 0 .6rem;font-size:.98rem;max-width:62ch}
.regle{position:relative;height:24px;margin:0 11px}
.regle::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.tick{position:absolute;top:50%;width:2px;height:10px;background:var(--line);transform:translate(-50%,-50%)}
.punt{position:absolute;top:50%;border-radius:50%;transform:translate(-50%,-50%)}
.punt.partit{width:12px;height:12px;background:var(--c)}
.punt.tu{width:22px;height:22px;border:3px solid var(--pedra)}
.llegenda .punt{position:static;transform:none;display:inline-block}
.extrems{display:flex;justify-content:space-between;gap:1rem;font-size:.8rem;color:var(--muted);margin-top:.15rem}
.extrems span:last-child{text-align:right}
.invitacio{background:var(--sup);border:1.5px solid var(--line);border-radius:.75rem;padding:1.25rem 1.25rem 1.4rem;margin:0 0 2rem;max-width:62ch}
.invitacio h3{font-size:1.3rem;margin-bottom:.5rem}
.invitacio p{margin:0 0 1rem;color:var(--muted)}

/* Enquesta */
.enquesta h3{font-size:1.35rem;margin:2.25rem 0 1rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.camp{border:0;padding:0;margin:0 0 1.6rem;min-width:0}
.camp legend,.camp .legend{display:block;font-weight:700;margin-bottom:.6rem;padding:0;max-width:62ch}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{position:relative;display:inline-block}
.pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pill span{display:inline-block;padding:.42rem .85rem;border:1.5px solid var(--line);border-radius:999px;background:var(--sup)}
.pill input:checked + span{background:var(--riu);border-color:var(--riu);color:#fff}
.pill input:focus-visible + span{outline:3px solid var(--pedra);outline-offset:2px}
.pill:hover span{border-color:var(--riu)}
.extrems-num{display:flex;justify-content:space-between;max-width:36rem;font-size:.85rem;color:var(--muted);margin-bottom:.4rem}
select,textarea{font:inherit;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:.5rem;background:var(--sup);color:var(--ink);width:100%;max-width:30rem}
@media (prefers-reduced-motion:reduce){.omple,.cercle{transition:none}}
</style>
</head>
<body>
<header class="capcalera">
  <span class="marca">Manresa 2027</span>
  <span class="etiqueta-pilot">Versió pilot</span>
</header>
<main id="app"></main>

<script>
// ============================================================
// RECOLLIDA DE RESPOSTES
// Enganxa aquí l'URL de l'aplicació web d'Apps Script (acaba en /exec).
// Si es deixa buit, no es mostra la casella i no s'envia res.

const URL_RECOLLIDA = "https://script.google.com/macros/s/AKfycbwd-R9lZMi-xXKN9EmKkkKTyYfNGkPKqna5dZ0TFDHaADycD53GV7VFwkgFd6-sE2TZ4A/exec";
const VERSIO = "pilot-2"; // canvia-ho quan modifiquis les preguntes

// ============================================================
// DADES DEL QÜESTIONARI (annex del document de projecte)
// Format "acord":   -2 Molt en desacord ... +2 Molt d'acord

const TEMES = [

];

const ITEMS = [
  { id: "P1", tema: "seg", format: "acord", text: "Manresa és una ciutat insegura." },
  { id: "P2", tema: "seg", format: "bipolar", text: "Per reduir la inseguretat, l’Ajuntament hauria de prioritzar…",
    a: "la prevenció (mediació, educació, acció social)", b: "les sancions i la presència policial" },
  { id: "P3", tema: "seg", format: "acord", text: "Manresa necessita més agents de la Policia Local." },
  { id: "P4", tema: "seg", format: "acord", text: "L’Ajuntament és el principal responsable de la seguretat a Manresa, per davant de la Generalitat i l’Estat." },

  { id: "P5", tema: "imm", format: "bipolar", text: "En general, la immigració a Manresa…",
    a: "aporta més beneficis que problemes", b: "genera més problemes que beneficis" },
  { id: "P6", tema: "imm", format: "acord", text: "L’Ajuntament hauria de destinar més recursos a l’acollida de les persones nouvingudes." },
  { id: "P7", tema: "imm", format: "acord", text: "Les famílies haurien de poder triar escola lliurement, encara que això concentri l’alumnat d’origen estranger en alguns centres." },
  { id: "P8", tema: "imm", format: "acord", text: "L’Ajuntament hauria d’empadronar totes les persones que viuen a la ciutat, encara que no tinguin un domicili regularitzat." },

  { id: "P9", tema: "hab", format: "bipolar", text: "Per abaratir l’habitatge, l’Ajuntament hauria de…",

  { id: "P12", tema: "mob", format: "acord", text: "Cal reduir l’espai destinat al cotxe al centre de la ciutat per guanyar espai per a vianants, bicicletes i zones verdes." },
  { id: "P13", tema: "mob", format: "acord", text: "Per millorar la connexió amb Barcelona, cal prioritzar el transport públic per davant de les infraestructures per al vehicle privat." },
  { id: "P14", tema: "mob", format: "acord", text: "La zona de baixes emissions de Manresa s’hauria de suavitzar o ajornar." },

  { id: "P15", tema: "net", format: "acord", text: "El nou sistema de contenidors és una millora per a la ciutat." },
  { id: "P16", tema: "net", format: "bipolar", text: "El servei de neteja hauria de ser gestionat…",
    a: "directament per l’Ajuntament", b: "per una empresa externa" },
  { id: "P17", tema: "net", format: "acord", text: "L’Ajuntament hauria de prioritzar la neteja i el manteniment del Barri Antic per davant d’altres barris." },

  { id: "P18", tema: "fis", format: "bipolar", text: "Prefereixo…",
    a: "pagar més impostos municipals i tenir més i millors serveis", b: "pagar menys impostos municipals, encara que hi hagi menys serveis" },

  { id: "P19", tema: "con", format: "acord", text: "L’Ajuntament hauria de posicionar-se activament contra l’extrema dreta." },
  { id: "P20", tema: "con", format: "acord", text: "Les pintades i els cartells polítics a l’espai públic s’haurien de sancionar, encara que siguin una forma d’expressió." },

  { id: "P21", tema: "cat", format: "acord", text: "Estic a favor que Catalunya sigui un estat independent." },
  { id: "P22", tema: "cat", format: "bipolar", text: "En la vida pública de Manresa, l’Ajuntament hauria de…",
    a: "promoure el català com a llengua principal", b: "garantir la mateixa presència del català i del castellà" },

  { id: "P23", tema: "rel", format: "bipolar", text: "Per aconseguir més recursos per a Manresa, l’Ajuntament hauria de ser, amb la Generalitat i l’Estat…",
    a: "més col·laboratiu", b: "més reivindicatiu" },

// Candidatures i posicions INVENTADES per al pilot
const CANDIDATURES = [
  { id: "A", nom: "Candidatura A", color: "#2E6F95", posicions: {
    P1:-1, P2:-2, P3:-1, P4:-1, P5:-2, P6:2, P7:-2, P8:2, P9:-2, P10:2, P11:-2, P12:2,

  { id: "C", nom: "Candidatura C", color: "#3F7F3D", posicions: {
    P1:1, P2:0, P3:1, P4:-1, P5:-1, P6:0, P7:1, P8:0, P9:1, P10:0, P11:0, P12:0,
    P13:0, P14:1, P15:-1, P16:1, P17:1, P18:1, P19:0, P20:1, P21:2, P22:-2, P23:-1, P24:0 } },
  { id: "D", nom: "Candidatura D", color: "#A65A2A", posicions: {
    P1:2, P2:2, P3:2, P4:1, P5:2, P6:-2, P7:2, P8:-2, P9:1, P10:0, P11:1, P12:-2,
    P13:-1, P14:2, P15:-2, P16:1, P17:0, P18:2, P19:-2, P20:2, P21:-2, P22:2, P23:1, P24:1 } }
];

// PER OMPLIR: llista de barris i candidatures de les municipals de 2023
const BARRIS = ["Barri Antic", "Barri 2", "Barri 3", "Barri 4"];
const CANDIDATURES_2023 = ["Candidatura 2023 (1)", "Candidatura 2023 (2)", "Candidatura 2023 (3)"];

// ============================================================
// ENQUESTA COMPLEMENTÀRIA (bloc C, opcional, després dels resultats)
// A totes les preguntes tancades s'hi afegeix "Prefereixo no respondre".
// ============================================================
const PNR = "Prefereixo no respondre";
const ENQUESTA = [
  { titol: "Sobre el recomanador", preguntes: [
    { id: "temes_recollits", text: "Creus que el recomanador recull els temes que consideres més rellevants per a Manresa?",

    { id: "temes_incloure", text: "Quin tema o temes creus que caldria incloure?", obert: true,

    { id: "situacio_laboral", text: "Quina és la teva situació laboral principal?",

  ]},
  { titol: "Política", preguntes: [
    { id: "ideologia", text: "On t’ubicaries en una escala on 0 és l’extrema esquerra i 10 l’extrema dreta?",

    { id: "identitat", text: "Amb quina d’aquestes frases t’identifiques més?",
      opcions: ["Només espanyol/a", "Més espanyol/a que català/na", "Tan espanyol/a com català/na", "Més català/na que espanyol/a", "Només català/na"] },
    { id: "interes", text: "Quin interès tens per la política municipal de Manresa?", opcions: ["Molt", "Bastant", "Poc", "Gens"] },
    { id: "record_vot", text: "A quina candidatura vas votar a les eleccions municipals de 2023?", desplegable: true,
      opcions: [...CANDIDATURES_2023, "No vaig votar", "No tenia dret a vot"] },
    { id: "participacio", text: "Tens previst votar a les eleccions municipals de 2027?",
      opcions: ["Segur que sí", "Probablement sí", "Probablement no", "Segur que no", "No tinc dret a vot"] },
    { id: "preferencia", text: "Si les eleccions municipals fossin demà, a quina candidatura votaries?", desplegable: true,
      opcions: [...CANDIDATURES.map(c => c.nom), "En blanc", "No votaria", "No ho sé"] }
  ]}
];

// ============================================================
// LÒGICA
// ============================================================
const ESCALA_ACORD = [
  { v: -2, l: "Molt en desacord" },
  { v: -1, l: "En desacord" },
  { v:  0, l: "Ni d’acord ni en desacord" },
  { v:  1, l: "D’acord" },
  { v:  2, l: "Molt d’acord" }
];
const ETIQ_BIPOLAR = ["Clarament", "Més aviat", "Entre totes dues", "Més aviat", "Clarament"];
const IMPORTANCIA = [
  { v: 0, l: "Gens important" }, { v: 1, l: "Poc important" }, { v: 2, l: "Bastant important" }, { v: 3, l: "Molt important" }
];

const app = document.getElementById("app");
const estat = { pas: "inici", i: 0 };

const nouId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2);
const majuscula = s => s.charAt(0).toUpperCase() + s.slice(1);
const nomTema = id => TEMES.find(t => t.id === id).nom;
function barreja(llista) {
  const a = [...llista];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function inicia() {
  estat.respostes = {};
  estat.importancia = {};
  // Ordre aleatori dels pols de cada ítem bipolar (es desa per controlar efectes d'ordre)
  estat.invertit = Object.fromEntries(ITEMS.filter(x => x.format === "bipolar").map(x => [x.id, Math.random() < 0.5]));
  // Ordre aleatori dels temes al bloc d'importància
  estat.ordreTemes = barreja(TEMES);
  estat.consentiment = false;
  estat.enviat = false;
  estat.enquestaEnviada = false;
  estat.id = nouId();
}

function etiqueta(item, v) {
  if (v == null) return "sense posició";
  if (item.format === "acord") return ESCALA_ACORD.find(o => o.v === v).l;
  if (v === 0) return "Entre totes dues";
  return (Math.abs(v) === 2 ? "Clarament " : "Més aviat ") + (v < 0 ? item.a : item.b);
}

// Coincidència per ítem: 1 - |u - p| / 4. Per tema: mitjana. Global: mitjana ponderada per importància.
// "No ho sé" (null) exclou l'ítem; el punt central compta com a posició.
function calcula(c) {
  let num = 0, den = 0;
  const perTema = {};
  for (const t of TEMES) {
    const its = ITEMS.filter(d => d.tema === t.id && estat.respostes[d.id] != null && c.posicions[d.id] != null);
    if (!its.length) continue;
    const a = its.reduce((s, d) => s + 1 - Math.abs(estat.respostes[d.id] - c.posicions[d.id]) / 4, 0) / its.length;
    perTema[t.id] = a;
    const w = estat.importancia[t.id] ?? 0;
    num += w * a;
    den += w;
  }
  return { total: den > 0 ? num / den : null, perTema };
}

function enviaFila(fila) {
  if (!URL_RECOLLIDA) return;
  fetch(URL_RECOLLIDA, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(fila)
  }).catch(() => {});
}

// Blocs A i B: una fila a la pestanya "respostes"
function enviaRespostes() {
  if (!URL_RECOLLIDA || !estat.consentiment || estat.enviat) return;
  const fila = { pestanya: "respostes", id: estat.id, versio: VERSIO };
  ITEMS.forEach(d => { fila[d.id] = estat.respostes[d.id] ?? ""; });
  ITEMS.filter(d => d.format === "bipolar").forEach(d => { fila["inv_" + d.id] = estat.invertit[d.id] ? 1 : 0; });
  TEMES.forEach(t => { fila["imp_" + t.id] = estat.importancia[t.id]; });
  enviaFila(fila);
  estat.enviat = true;
}

function render() {
  window.scrollTo(0, 0);
  ({ inici: renderInici, pregunta: renderPregunta, importancia: renderImportancia,
     resultats: renderResultats, enquesta: renderEnquesta })[estat.pas]();
  const h = document.getElementById("enunciat");
  if (h && estat.pas !== "inici") h.focus();
}

function renderInici() {
  app.innerHTML = `
    <section>
      <h1>Amb quina candidatura coincideixes més?</h1>
      <p class="lead">Respon ${ITEMS.length} preguntes sobre la ciutat, indica quins temes t’importen més i veuràs la teva coincidència amb cada candidatura, tema per tema.</p>
      <p class="avis"><strong>Versió pilot.</strong> Les candidatures i les seves posicions són inventades per provar l’eina.</p>
      <button class="primari" id="comenca">Comença</button>
    </section>`;
  document.getElementById("comenca").onclick = () => { inicia(); estat.pas = "pregunta"; estat.i = 0; render(); };
}

function seguent() {
  if (estat.i < ITEMS.length - 1) estat.i++;
  else estat.pas = "importancia";
  render();
}

function htmlAcord(d, actual) {
  return `<div class="opcions" role="group" aria-labelledby="enunciat">
    ${ESCALA_ACORD.map(o => `<button class="opcio" data-v="${o.v}" aria-pressed="${actual === o.v}">${o.l}</button>`).join("")}
  </div>`;
}

function htmlBipolar(d, actual) {
  const inv = estat.invertit[d.id];
  const esq = inv ? d.b : d.a, dre = inv ? d.a : d.b;
  const parades = [0, 1, 2, 3, 4].map(k => {
    const v = inv ? 2 - k : k - 2;
    const pol = k < 2 ? esq : k > 2 ? dre : null;
    const label = pol ? `${ETIQ_BIPOLAR[k]}: ${pol}` : "Entre totes dues";
    return `<button class="parada" data-v="${v}" aria-pressed="${actual === v}" aria-label="${label}">
      <span class="cercle-caixa"><span class="cercle"></span></span>
      <span class="etiq" aria-hidden="true">${ETIQ_BIPOLAR[k]}</span>
    </button>`;
  }).join("");
  return `<div class="bipolar">
    <div class="pols" aria-hidden="true"><p class="pol">${majuscula(esq)}</p><p class="pol dre">${majuscula(dre)}</p></div>
    <div class="linia" role="group" aria-labelledby="enunciat">${parades}</div>
  </div>`;
}

function renderPregunta() {
  const d = ITEMS[estat.i];
  const actual = estat.respostes[d.id];
  app.innerHTML = `
    <section>
      <div class="progres"><span>${nomTema(d.tema)}</span><span>${estat.i + 1} de ${ITEMS.length}</span></div>
      <div class="barra-progres" aria-hidden="true"><div style="width:${estat.i / ITEMS.length * 100}%"></div></div>
      <h2 id="enunciat" tabindex="-1">${d.text}</h2>
      ${d.format === "acord" ? htmlAcord(d, actual) : htmlBipolar(d, actual)}
      <div class="ns"><button class="opcio-ns" id="ns" aria-pressed="${actual === null}">No ho sé</button></div>
      <div class="nav">
        <button class="secundari" id="enrere">${estat.i === 0 ? "Torna a l’inici" : "Pregunta anterior"}</button>
      </div>
    </section>`;
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { estat.respostes[d.id] = Number(b.dataset.v); seguent(); });
  document.getElementById("ns").onclick = () => { estat.respostes[d.id] = null; seguent(); };
  document.getElementById("enrere").onclick = () => {
    if (estat.i === 0) estat.pas = "inici"; else estat.i--;
    render();
  };
}

function renderImportancia() {
  const textFalten = () => {
    const n = TEMES.filter(t => estat.importancia[t.id] === undefined).length;
    return { n, text: n === 0 ? "" : n === 1 ? "Falta 1 tema per valorar." : `Falten ${n} temes per valorar.` };
  };
  const f = textFalten();
  app.innerHTML = `
    <section>
      <h2 id="enunciat" tabindex="-1">Quina importància tenen per a tu aquests temes a l’hora de decidir el teu vot a les municipals?</h2>
      <p class="lead">Els temes més importants per a tu pesaran més en el resultat. Si en marques un com a “Gens important”, no compta.</p>
      <div class="temes">
        ${estat.ordreTemes.map(t => `
          <div class="tema-fila">
            <span class="tema-nom" id="tn-${t.id}">${t.nom}</span>
            <div class="segmentat" role="group" aria-labelledby="tn-${t.id}">
              ${IMPORTANCIA.map(o => `<button data-t="${t.id}" data-v="${o.v}" aria-pressed="${estat.importancia[t.id] === o.v}">${o.l.split(" ")[0]}</button>`).join("")}
            </div>
          </div>`).join("")}
      </div>
      <p class="falten" id="falten" aria-live="polite">${f.text}</p>
      ${URL_RECOLLIDA && !estat.enviat ? `
        <label class="consentiment">
          <input type="checkbox" id="consent" ${estat.consentiment ? "checked" : ""}>
          <span>Accepto que les meves respostes es guardin de manera anònima per fer estadístiques agregades. No es recull cap dada que m’identifiqui.</span>
        </label>` : ""}
      <div class="nav">
        <button class="secundari" id="enrere">Pregunta anterior</button>
        <button class="primari" id="veure" ${f.n ? "disabled" : ""}>Mostra els resultats</button>
      </div>
    </section>`;
  app.querySelectorAll(".segmentat button").forEach(b => b.onclick = () => {
    estat.importancia[b.dataset.t] = Number(b.dataset.v);
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    const g = textFalten();
    document.getElementById("falten").textContent = g.text;
    document.getElementById("veure").disabled = g.n > 0;
  });
  const consent = document.getElementById("consent");
  if (consent) consent.onchange = () => { estat.consentiment = consent.checked; };
  document.getElementById("enrere").onclick = () => { estat.pas = "pregunta"; estat.i = ITEMS.length - 1; render(); };
  document.getElementById("veure").onclick = () => { enviaRespostes(); estat.pas = "resultats"; render(); };
}

function regle(d, c) {
  const u = estat.respostes[d.id], p = c.posicions[d.id];
  const pos = v => (v + 2) / 4 * 100;
  const [esq, dre] = d.format === "acord" ? ["Molt en desacord", "Molt d’acord"] : [majuscula(d.a), majuscula(d.b)];
  const text = d.format === "acord" ? d.text : `${d.text} ${d.a} o ${d.b}`;
  return `
    <div class="dim">
      <p>${text}</p>
      <div class="regle" role="img" aria-label="Tu: ${etiqueta(d, u)}. ${c.nom}: ${etiqueta(d, p)}.">
        ${[0, 25, 50, 75, 100].map(x => `<span class="tick" style="left:${x}%"></span>`).join("")}
        <span class="punt partit" style="left:${pos(p)}%"></span>
        <span class="punt tu" style="left:${pos(u)}%"></span>
      </div>
      <div class="extrems" aria-hidden="true"><span>${esq}</span><span>${dre}</span></div>
    </div>`;
}

function fila(r) {
  const temes = TEMES.filter(t => r.perTema[t.id] !== undefined);
  return `
    <li><details style="--c:${r.c.color}">
      <summary>
        <span class="nom">${r.c.nom}</span>
        <span class="pct">${Math.round(r.total * 100)}%</span>
        <span class="pista" aria-hidden="true"><span class="omple" data-w="${r.total * 100}"></span></span>
        <span class="mes"></span>
      </summary>
      <div class="detall">
        <p class="llegenda">
          <span><span class="punt tu"></span>Tu</span>
          <span><span class="punt partit"></span>${r.c.nom}</span>
        </p>
        ${temes.map(t => `
          <div class="tema-detall">
            <h3>${t.nom}<span>${Math.round(r.perTema[t.id] * 100)}%${estat.importancia[t.id] === 0 ? " (no compta)" : ""}</span></h3>
            ${ITEMS.filter(d => d.tema === t.id && estat.respostes[d.id] != null && r.c.posicions[d.id] != null)
              .map(d => regle(d, r.c)).join("")}
          </div>`).join("")}
      </div>
    </details></li>`;
}

function renderResultats() {
  const res = CANDIDATURES.map(c => ({ c, ...calcula(c) }))
    .filter(r => r.total !== null)
    .sort((a, b) => b.total - a.total);

  if (!res.length) {
    app.innerHTML = `
      <section>
        <h2 id="enunciat" tabindex="-1">Encara no podem calcular la coincidència</h2>
        <p class="lead">Cal respondre almenys una pregunta i donar una mica d’importància a algun tema.</p>
        <button class="primari" id="reinicia">Torna a començar</button>
      </section>`;
  } else {
    app.innerHTML = `
      <section>
        <h2 id="enunciat" tabindex="-1">La teva coincidència amb cada candidatura</h2>
        <p class="lead">Obre cada candidatura per veure en què coincidiu i en què no.</p>
        <ol class="llista">${res.map(fila).join("")}</ol>
        ${estat.enviat && !estat.enquestaEnviada ? `
          <div class="invitacio">
            <h3>Ens ajudes amb unes preguntes més?</h3>
            <p>Són voluntàries i anònimes. Ens serveixen per millorar el recomanador i analitzar els resultats de manera agregada.</p>
            <button class="primari" id="obre-enquesta">Respon l’enquesta</button>
          </div>` : ""}
        ${estat.enquestaEnviada ? `<p class="avis">Gràcies per respondre l’enquesta.</p>` : ""}
        <p class="avis">Recorda que és un pilot: les candidatures i les posicions són inventades.</p>
        <div class="nav">
          <button class="secundari" id="importancia">Canvia la importància dels temes</button>
          <button class="secundari" id="reinicia">Torna a començar</button>
        </div>
      </section>`;
    document.getElementById("importancia").onclick = () => { estat.pas = "importancia"; render(); };
    const obre = document.getElementById("obre-enquesta");
    if (obre) obre.onclick = () => { estat.pas = "enquesta"; render(); };
    requestAnimationFrame(() => requestAnimationFrame(() =>
      app.querySelectorAll(".omple").forEach(el => el.style.width = el.dataset.w + "%")));
  }
  document.getElementById("reinicia").onclick = () => { estat.pas = "inici"; render(); };
}

const opcionsDe = p => p.opcions.includes(PNR) ? p.opcions : [...p.opcions, PNR];

function campHtml(p) {
  const si = p.si ? ` data-si="${p.si.id}" data-valors="${p.si.valors.join("|")}" hidden` : "";
  if (p.obert) return `
    <div class="camp"${si}>
      <label class="legend" for="q-${p.id}">${p.text}</label>
      <textarea id="q-${p.id}" name="${p.id}" rows="3"></textarea>
    </div>`;
  if (p.desplegable) return `
    <div class="camp"${si}>
      <label class="legend" for="q-${p.id}">${p.text}</label>
      <select id="q-${p.id}" name="${p.id}">
        <option value="">Tria una opció</option>
        ${opcionsDe(p).map(o => `<option>${o}</option>`).join("")}
      </select>
    </div>`;
  return `
    <fieldset class="camp"${si}>
      <legend>${p.text}</legend>
      ${p.extrems ? `<div class="extrems-num" aria-hidden="true"><span>${p.extrems[0]}</span><span>${p.extrems[1]}</span></div>` : ""}
      <div class="pills">
        ${opcionsDe(p).map(o => `<label class="pill"><input type="radio" name="${p.id}" value="${o}"><span>${o}</span></label>`).join("")}
      </div>
    </fieldset>`;
}

function valorDe(nom) {
  const r = app.querySelector(`input[name="${nom}"]:checked`);
  if (r) return r.value;
  const el = app.querySelector(`select[name="${nom}"], textarea[name="${nom}"]`);
  return el ? el.value.trim() : "";
}

function renderEnquesta() {
  app.innerHTML = `
    <section class="enquesta">
      <h2 id="enunciat" tabindex="-1">Unes preguntes més</h2>
      <p class="lead">Totes són opcionals. Pots deixar en blanc les que vulguis.</p>
      ${ENQUESTA.map(sec => `<h3>${sec.titol}</h3>${sec.preguntes.map(campHtml).join("")}`).join("")}
      <div class="nav">
        <button class="secundari" id="tornar">Torna als resultats</button>
        <button class="primari" id="envia-enquesta">Envia les respostes</button>
      </div>
    </section>`;
  const actualitza = () => app.querySelectorAll("[data-si]").forEach(el => {
    el.hidden = !el.dataset.valors.split("|").includes(valorDe(el.dataset.si));
  });
  app.querySelector(".enquesta").addEventListener("change", actualitza);
  document.getElementById("tornar").onclick = () => { estat.pas = "resultats"; render(); };
  document.getElementById("envia-enquesta").onclick = () => {
    if (estat.enquestaEnviada) return;
    const fila = { pestanya: "enquesta", id: estat.id, versio: VERSIO };
    ENQUESTA.forEach(sec => sec.preguntes.forEach(p => {
      const camp = app.querySelector(`[name="${p.id}"]`).closest(".camp");
      fila[p.id] = camp.hidden ? "" : valorDe(p.id);
    }));
    enviaFila(fila);
    estat.enquestaEnviada = true;
    estat.pas = "resultats";
    render();
  };
}

render();
</script>
</body>
</html>
